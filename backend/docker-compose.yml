# Postgres and the API. Background jobs run inside the API (HIBANAKO_TASKS_INLINE=true).
#   docker compose up -d db                # just the database; run the API with uv
#   docker compose up --build              # everything
# Host port 5433 avoids clashing with a local Postgres.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: heatmark
      POSTGRES_PASSWORD: heatmark
      POSTGRES_DB: heatmark
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmark"]
      interval: 2s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      HIBANAKO_DATABASE_URL: postgresql+asyncpg://heatmark:heatmark@db:5432/heatmark
      HIBANAKO_TASKS_INLINE: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/secrets/adc.json:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

[project]
name = "hibanako"
version = "0.1.0"
description = "Hibanako quality traceability backend: document extraction, traceability mapping and rule checks."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31,<3",
    "litestar[standard]>=2.24,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "asyncpg>=0.32",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "openpyxl>=3.1",
    "pypdf>=5",
    "google-cloud-storage>=3",
    "pyjwt>=2.10",
    "google-auth[requests]>=2.40",
    "alembic>=1.14",
    "google-cloud-tasks>=2.19",
    "pypdfium2>=4.30",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
